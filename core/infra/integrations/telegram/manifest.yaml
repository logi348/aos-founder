# Telegram Integration Manifest
# This is the reference pattern for all AOS integrations.

name: Telegram
version: "1.0"
category: communication

description: >
  Primary messaging interface between operator and AOS.
  Operator sends commands via Telegram, agents respond.
  Includes heartbeat monitoring and slash command routing.

# What this integration provides to the system
provides:
  messaging:
    type: bidirectional
    description: Send and receive messages with the operator
  commands:
    type: input
    description: Slash commands routed to skills and agents
  heartbeat:
    type: monitoring
    description: Periodic alive signal with optional status

# What this integration needs to function
requires:
  secrets:
    - key: TELEGRAM_BOT_TOKEN
      store: keychain
      description: Bot token from @BotFather
    - key: TELEGRAM_CHAT_ID
      store: keychain
      description: Operator's chat ID for auth
  services:
    - name: bridge
      type: launchagent
      plist: com.aos.bridge
  config:
    - key: telegram.bot_username
      file: ~/.aos/services/bridge/config.yaml

# How to verify this integration is working
health:
  checks:
    - name: bridge_running
      command: "launchctl list | grep com.aos.bridge"
      expect: running
    - name: bot_reachable
      command: "curl -s https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe"
      expect: '"ok":true'
    - name: heartbeat_recent
      command: "find ~/.aos/services/bridge/ -name 'heartbeat.json' -mmin -5"
      expect: non-empty

# Capability chain entries this integration adds.
capabilities:
  Telegram:
    method: api
    cost: zero
    notes: "Telegram Bot API via bridge service. Send/receive messages, slash commands."

# Layers this integration touches
layers:
  - interface    # Telegram is a user interface
  - services     # Bridge runs as a LaunchAgent
  - integrations # This manifest

# Setup steps (run by onboarding agent or manually)
setup:
  steps:
    - description: Create Telegram bot via @BotFather (operator, on their phone)
      type: interactive
      instruction: "Message @BotFather on Telegram, /newbot, keep the token message open"
    - description: Store bot token (operator types it at a hidden prompt)
      type: interactive
      instruction: "agent-secret set TELEGRAM_BOT_TOKEN   (no value on the command line)"
    - description: Pair the bot with the operator's own account
      type: interactive
      instruction: "aos telegram-pair — verifies a one-time code sent from the operator's @username before storing TELEGRAM_CHAT_ID / TELEGRAM_USER_ID"
    - description: Install bridge service
      type: command
      command: "core/infra/integrations/telegram/setup.sh"
    - description: Verify
      type: health_check
